<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Completing Ace ID popup sign-in</title>
    <style>
      :root { color-scheme: light; font: 16px/1.55 system-ui, sans-serif; color: #182742; background: #f4f7fb; }
      body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; }
      main { width: min(100%, 440px); padding: 30px; border: 1px solid #e2e9f2; border-radius: 20px; background: #fff; box-shadow: 0 18px 55px rgba(35,56,93,.1); }
      .eyebrow { color: #526fd0; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 8px 0 10px; font-size: 23px; letter-spacing: -.03em; }
      p { color: #66748b; font-size: 14px; overflow-wrap: anywhere; }
      .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
      a, button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 9px 13px; border: 0; border-radius: 11px; color: #fff; background: #4b69db; font: inherit; font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; }
      button { color: #31425e; border: 1px solid #dce4ef; background: #fff; }
      a:focus-visible, button:focus-visible { outline: 3px solid rgba(77, 111, 235, .3); outline-offset: 3px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Secure callback</span>
      <h1>Finishing sign-in</h1>
      <p id="status" role="status" aria-live="polite">Waiting for the app to verify this sign-in…</p>
      <div class="actions">
        <button id="close-popup" type="button" hidden>Close popup and retry in the app</button>
        <a id="return-link" hidden>Open the demo app in this window</a>
      </div>
    </main>
    <script src="../../dist/ace-id-sdk.global.js"></script>
    <script src="./config.local.js"></script>
    <script src="./callback.js"></script>
  </body>
</html>
