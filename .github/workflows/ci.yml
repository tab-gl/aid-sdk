name: SDK CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-sdk:
    name: Node SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Audit production and development dependencies
        run: |
          npm audit --omit=dev
          npm audit
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check bundle size budgets
        run: npm run check:bundle
      - name: Verify package exports and payload
        run: npm run verify:package
      - name: Check publish contents
        run: npm pack --dry-run
      - name: Install and verify the generated tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ace-id-sdk-pack"
          TARBALL="$(npm pack --silent --pack-destination "$RUNNER_TEMP/ace-id-sdk-pack")"
          npm run verify:tarball -- "$RUNNER_TEMP/ace-id-sdk-pack/$TARBALL"
